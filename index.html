<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Random User Generator</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body class="bg-light">

  <div class="container py-5">
    <div class="row justify-content-center mb-4">
      <div class="col-md-6 d-flex justify-content-center">
        <input id="numBox" type="number" 
               class="form-control rounded-pill text-center shadow-sm me-2"
               placeholder="Enter number of random users (0-1000)" 
               min="0" max="1000">
        <button id="getUsers" class="btn rounded-pill shadow-sm">
          Generate Users
        </button>
      </div>
    </div>

    <div id="err" class="alert alert-danger d-none text-center"></div>

    <div class="row text-center header-row mb-2">
      <div class="col">
        <select id="nameOpt" class="form-select rounded-pill text-center">
          <option value="first">First Name</option>
          <option value="last">Last Name</option>
        </select>
      </div>
      <div class="col">Gender</div>
      <div class="col">Email</div>
      <div class="col">Country</div>
    </div>

    <div id="rowsBox"></div>
  </div>

  <div class="modal fade" id="userModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-lg modal-dialog-centered">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title">User Information</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body">
          <div class="d-flex align-items-center mb-3">
            <img id="modalImg" src="" class="rounded-circle me-3" width="80" height="80">
            <h5 id="modalName"></h5>
          </div>
          <form id="userForm">
            <div class="mb-2">
              <label class="form-label">Full Name</label>
              <input id="modalFullName" type="text" class="form-control" readonly>
            </div>
            <div class="mb-2">
              <label class="form-label">Address</label>
              <textarea id="modalAddress" class="form-control" rows="2" readonly></textarea>
            </div>
            <div class="mb-2">
              <label class="form-label">Email</label>
              <input id="modalEmail" type="email" class="form-control" readonly>
            </div>
            <div class="mb-2">
              <label class="form-label">Phone</label>
              <input id="modalPhone" type="text" class="form-control" readonly>
            </div>
            <div class="mb-2">
              <label class="form-label">Cell</label>
              <input id="modalCell" type="text" class="form-control" readonly>
            </div>
            <div class="mb-2">
              <label class="form-label">DOB</label>
              <input id="modalDOB" type="text" class="form-control" readonly>
            </div>
            <div class="mb-2">
              <label class="form-label">Gender</label>
              <input id="modalGender" type="text" class="form-control" readonly>
            </div>
          </form>
        </div>
        <div class="modal-footer">
          <button id="editBtn" class="btn btn-warning">✏️ Edit</button>
          <button id="saveBtn" class="btn btn-success d-none">💾 Save</button>
          <button id="deleteBtn" class="btn btn-danger">🗑️ Delete</button>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
